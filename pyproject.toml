# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "release-drift"
version = "0.6.0"
description = "Report what a package release adds: changed files, new install and startup code, files not in the tagged source."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
keywords = ["supply-chain", "security", "pypi", "npm", "wheel", "sdist", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/jacob-adm/release-drift"
Documentation = "https://github.com/jacob-adm/release-drift/tree/main/docs"
Source = "https://github.com/jacob-adm/release-drift"
Issues = "https://github.com/jacob-adm/release-drift/issues"

[project.scripts]
release-drift = "release_drift.cli:main"

[tool.setuptools]
packages = ["release_drift"]
